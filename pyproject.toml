[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickrag"
version = "0.1.0"
description = "Fast, plug-and-play RAG framework built on LangGraph"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["rag", "langgraph", "qdrant", "llm", "retrieval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.0.0",
    "fastembed>=0.4.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
    # Document loaders
    "pypdf>=5.0.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.13.0",
    "unstructured>=0.15.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]
all = ["quickrag[api,dev]"]

[project.scripts]
quickrag = "quickrag.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/QuickRAG"
Repository = "https://github.com/yourusername/QuickRAG"

[tool.hatch.build.targets.wheel]
packages = ["quickrag"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

